# Cloudflare Worker (with static assets) config for the Gleamly estimator.
#
# Cloudflare's dashboard created this project as a "Worker with static
# assets" rather than classic Pages, so the backend is one entry script
# (src/worker.js) that routes /api/* by hand and falls back to serving the
# static site (index.html, script.js, admin.html, etc.) for everything else.
#
# Submitted photos are attached directly to the notification email (see
# src/routes/submit-quote.js) rather than stored anywhere — no object
# storage bucket needed, and nothing to delete later either. This also
# avoids Cloudflare R2's subscription requirement, which needs a payment
# method on file even for free-tier usage.
#
# Setup still needed before this works (none of it is in this repo, on
# purpose — secrets never get committed):
#
#   1. Create a KV namespace (dashboard: project -> Settings -> Bindings ->
#      Add binding -> KV namespace -> Create new), bind it with variable
#      name PRICING_KV, and put its id below in place of the placeholder.
#   2. ADMIN_PASSWORD and ADMIN_SESSION_SECRET are declared below as
#      Secrets Store bindings — every value lives in the account's Secrets
#      Store (dashboard search -> "Secrets Store"), never in this file.
#      This project is Git-connected, so every push runs `wrangler deploy`
#      fresh from this file alone — any binding added only through the
#      dashboard's "Add binding" UI gets silently dropped on the next push
#      unless it's also declared here. That's what caused the admin login
#      to keep failing: the binding existed in the dashboard but not here.
#   3. RECAPTCHA_SECRET_KEY is declared below the same way. Still need to
#      set these the same way (create the Secrets Store entry, then add
#      the binding in the dashboard once so Cloudflare links it — after
#      that this file keeps it alive across deploys):
#        RESEND_API_KEY        — from https://resend.com
#        NOTIFY_FROM_EMAIL     — the "from" address Resend sends as (must be a verified domain/sender in Resend)
#        NOTIFY_TO_EMAIL       — Patricia's inbox
#   4. Also put the reCAPTCHA *site* key (the public one) into
#      RECAPTCHA_SITE_KEY near the top of script.js — that one is safe to
#      commit, unlike the secret key above.
#   5. First login to /admin.html will show every price field empty (KV
#      hasn't been seeded yet) — fill in the current values from CONFIG in
#      script.js and hit Save once to seed it.

name = "gleamly-estimator"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
# Serves everything in the repo root except what .assetsignore excludes.
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "PRICING_KV"
id = "0ec5548c5f5744d8a86185fb81457c48"

[[secrets_store_secrets]]
binding = "ADMIN_PASSWORD"
store_id = "d2a4c4f02cf74c9dbf2f14bd0f098808"
secret_name = "admin-password"

[[secrets_store_secrets]]
binding = "ADMIN_SESSION_SECRET"
store_id = "d2a4c4f02cf74c9dbf2f14bd0f098808"
secret_name = "admin-session-secret"

[[secrets_store_secrets]]
binding = "RECAPTCHA_SECRET_KEY"
store_id = "d2a4c4f02cf74c9dbf2f14bd0f098808"
secret_name = "recaptcha-secret-key"
# (redeploy trigger)
